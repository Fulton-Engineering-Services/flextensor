site_name: FlexTensor Documentation
site_description: Tensor offloading and management library for PyTorch
site_url: https://ai-dynamo.github.io/flextensor/
site_dir: build/docs

repo_url: https://github.com/ai-dynamo/flextensor
repo_name: flextensor

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  palette:
    primary: black
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.expand
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest

nav:
  - Get Started:
      - Overview: index.md
      - Quick Start: quick-start.md
      - Installation: installation.md
  - Understand:
      - Configuration: explanation/configuration.md
      - Pattern Matching: explanation/pattern-matching.md
      - Internal Phases: explanation/phases.md
      - Tensor Discovery: explanation/tensor-discovery.md
  - Guides:
      - Troubleshooting: how-to/troubleshooting.md
      - Configure for Common Scenarios: how-to/configure-for-common-scenarios.md
      - Exclude Patterns: how-to/exclude-patterns.md
      - torch.compile: how-to/torch-compile.md
  - Reference:
      - Overview: api/index.md
      - Glossary: api/glossary.md
      - Simplified API: api/simplified.md
      - OffloadManager: api/offload-manager.md
      - Configuration: api/configuration.md
      - Strategies: api/strategies.md
      - Advanced: api/advanced.md
  - Dashboard: https://github.com/ai-dynamo/flextensor

plugins:
  - search
  - mkdocstrings:
      enable_inventory: true
      default_handler: python
      handlers:
        python:
          paths: ["src"]
          import:
            - https://docs.python.org/3/objects.inv
            - https://pytorch.org/docs/stable/objects.inv
          options:
            docstring_style: google
            docstring_options:
              trim_doctest_flags: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            heading_level: 2
            members_order: source
            show_source: false
            show_bases: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            merge_init_into_class: true
            inherited_members: true
            docstring_section_style: spacy
            filters:
              - "!^_"
  - mike:
      alias_type: symlink
      redirect_template: null
      deploy_prefix: ""
      canonical_version: latest
      version_selector: true
      css_dir: css
      javascript_dir: js

watch:
  - docs
  - mkdocs.yml
  - README.md
  - src/flextensor

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - abbr
  - pymdownx.snippets:
      auto_append:
        - docs/includes/abbreviations.md
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

extra:
  version:
    provider: mike
    default: latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ai-dynamo/flextensor

extra_css:
  - assets/stylesheets/extra.css
